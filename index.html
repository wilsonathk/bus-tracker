<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士實時到站查詢 (簡易版)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; text-align: center; }
        input { padding: 10px; width: 70%; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #004494; }
        #result { margin-top: 20px; text-align: left; }
        .bus-item { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 5px solid #0056b3; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🚌 巴士實時到站查詢</h1>
    <p>輸入巴士站編號 (例如: 8571BCC3A3E4006E)</p>
    <input type="text" id="stopId" placeholder="請輸入站號..." value="8571BCC3A3E4006E">
    <button onclick="searchBus()">查詢</button>
    
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
